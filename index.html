<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>影渡り</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232c2747'/%3E%3Cpath d='M20 6a10 10 0 1 0 6 16A8 8 0 0 1 20 6z' fill='%23f4f0ff'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #3b2f4a;
    --panel: rgba(255, 248, 236, 0.82);
    --accent: #6b5ca5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #efd6b2; color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  .bar { position: fixed; left: 0; right: 0; display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 10px 16px; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  #top { top: env(safe-area-inset-top); flex-direction: column; gap: 6px; }
  #top .row { display: flex; align-items: center; gap: 10px; background: var(--panel);
    padding: 6px 10px; border-radius: 999px; box-shadow: 0 2px 10px rgba(80, 50, 30, 0.12); }
  #level-num { font-size: 13px; opacity: 0.65; font-variant-numeric: tabular-nums; }
  #level-num, #level-name, #moves { white-space: nowrap; }
  @media (max-width: 420px) { #top .row { gap: 4px; padding: 6px 6px; } #level-name { min-width: 0; font-size: 15px; } }
  #level-name { font-weight: 700; font-size: 16px; min-width: 7em; text-align: center; }
  #moves { font-size: 13px; opacity: 0.75; font-variant-numeric: tabular-nums; min-width: 3.5em; text-align: right; }
  #hint { font-size: 13px; background: var(--panel); padding: 5px 12px; border-radius: 10px; max-width: 520px; text-align: center; }
  #bottom { bottom: env(safe-area-inset-bottom); padding-bottom: 18px; }
  button { font: inherit; color: var(--ink); background: var(--panel); border: none; border-radius: 14px;
    padding: 10px 14px; min-width: 52px; min-height: 48px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(80, 50, 30, 0.15); display: flex; flex-direction: column; align-items: center; gap: 1px; }
  button:active { transform: translateY(1px); background: #fff; }
  button:disabled { opacity: 0.35; cursor: default; transform: none; }
  button .ico { font-size: 20px; line-height: 1; }
  button .lbl { font-size: 10px; opacity: 0.7; }
  button .key { font-size: 9px; opacity: 0.45; }
  #top button { min-height: 32px; min-width: 32px; padding: 4px 8px; box-shadow: none; background: transparent; }
  .sun button .ico { color: #d98a1c; }
  .spacer { width: 12px; }
  #toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(0.9); opacity: 0;
    background: rgba(60, 30, 40, 0.85); color: #fff; padding: 10px 18px; border-radius: 12px; font-size: 15px;
    transition: opacity 0.2s, transform 0.2s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #clear { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(50, 40, 80, 0.35); }
  #clear[hidden] { display: none; }
  #clear .card { background: #fffaf0; padding: 24px 32px; border-radius: 20px; text-align: center;
    box-shadow: 0 10px 40px rgba(40, 20, 60, 0.3); }
  #clear h2 { margin: 0 0 6px; font-size: 26px; color: var(--accent); }
  #clear p { margin: 0 0 16px; opacity: 0.75; }
  #clear button { margin: 0 auto; background: var(--accent); color: #fff; padding: 10px 28px; font-weight: 700; }
  #clear .note { color: #c07a12; font-weight: 700; margin-top: -8px; }
  #best { font-size: 11px; opacity: 0.6; font-variant-numeric: tabular-nums; }
  #select { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(50, 40, 80, 0.35); padding: 16px; }
  #select[hidden] { display: none; }
  #select .card { background: #fffaf0; border-radius: 20px; padding: 20px; width: min(560px, 100%);
    max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(40, 20, 60, 0.3); }
  #select h2 { margin: 0; font-size: 20px; color: var(--accent); text-align: center; }
  #select-sum { margin: 4px 0 12px; text-align: center; font-size: 13px; opacity: 0.7; }
  #select-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); grid-auto-rows: max-content;
    gap: 8px; overflow-y: auto; padding: 2px; flex: 1 1 auto; min-height: 0; }
  #select .stage { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 14px;
    background: #f3eadb; cursor: pointer; line-height: 1.3; text-align: left; }
  #select .stage:hover { background: #efe3cf; }
  #select .stage .thumb { width: 100%; height: auto; aspect-ratio: 232 / 120; margin-bottom: 2px; }
  #select .stage.done { background: #e9e3f6; }
  #select .stage.current { outline: 2px solid var(--accent); }
  #select .stage .no { font-size: 12px; font-weight: 700; color: var(--accent); }
  #select .stage .nm { font-size: 13px; }
  #select .stage .bt { font-size: 11px; opacity: 0.6; font-variant-numeric: tabular-nums; }
  .settings { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .settings button { min-height: 38px; padding: 6px 12px; font-size: 13px; flex-direction: row; box-shadow: none; background: #f3eadb; }
  .settings button.off { opacity: 0.6; }
  #title { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(ellipse at 50% 35%, rgba(255, 244, 222, 0.75), rgba(214, 186, 150, 0.92)); }
  #title[hidden] { display: none; }
  #title { z-index: 10; } #clear { z-index: 15; } #select { z-index: 20; } #toast { z-index: 30; }
  .title-card { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 420px; width: 100%; }
  .title-card h1 { margin: 0; font-size: clamp(40px, 11vw, 64px); letter-spacing: 0.08em; color: #2c2747; }
  .title-card .tagline { margin: 0 0 18px; opacity: 0.75; }
  .title-card .moon { width: 56px; height: 56px; border-radius: 50%; box-shadow: 14px -6px 0 0 #f4f0ff;
    margin: 0 0 6px 0; transform: translateX(-10px); filter: drop-shadow(0 0 12px rgba(170, 160, 255, 0.9)); }
  .title-card button { width: min(280px, 100%); }
  .title-card .primary { background: var(--accent); color: #fff; font-weight: 700; font-size: 18px; padding: 12px; gap: 2px; }
  .title-card .primary .sub { font-size: 12px; font-weight: 400; opacity: 0.85; }
  .title-card .wide { font-size: 16px; }
  .title-card .settings button { width: auto; }
  .title-card .credit { font-size: 11px; opacity: 0.45; margin-top: 18px; }
  #help { position: fixed; right: 12px; bottom: 12px; font-size: 10px; opacity: 0.45; text-align: right; line-height: 1.5; }
  @media (max-width: 600px), (pointer: coarse) { #help, button .key { display: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="top" class="bar">
  <div class="row">
    <button id="btn-menu" data-i18n-aria="ariaMenu">☰</button>
    <button id="btn-prev" data-i18n-aria="ariaPrev">◀</button>
    <span id="level-num"></span>
    <span id="level-name"></span>
    <span id="moves"></span>
    <button id="btn-next" data-i18n-aria="ariaNext">▶</button>
  </div>
  <div id="best"></div>
  <div id="hint"></div>
</div>

<div id="bottom" class="bar">
  <span class="sun"><button id="btn-ccw"><span class="ico">☀⟲</span><span class="lbl" data-i18n="sun"></span><span class="key">Q</span></button></span>
  <span class="sun"><button id="btn-cw"><span class="ico">⟳☀</span><span class="lbl" data-i18n="sun"></span><span class="key">E</span></button></span>
  <span class="spacer"></span>
  <button id="btn-undo"><span class="ico">↶</span><span class="lbl" data-i18n="undo"></span><span class="key">Z</span></button>
  <button id="btn-reset"><span class="ico">↺</span><span class="lbl" data-i18n="restart"></span><span class="key">R</span></button>
</div>

<div id="toast"></div>

<div id="clear" hidden>
  <div class="card">
    <h2 data-i18n="clearTitle"></h2>
    <p id="clear-moves"></p>
    <p id="clear-note" class="note" hidden></p>
    <button id="btn-clear-next" data-i18n="next"></button>
  </div>
</div>

<div id="select" hidden>
  <div class="card">
    <h2 data-i18n="stages"></h2>
    <p id="select-sum"></p>
    <div id="select-grid"></div>
    <div class="settings">
      <button class="btn-lang" data-i18n="langSwitch"></button>
      <button class="btn-sfx"></button>
    </div>
    <div class="settings">
      <button id="btn-to-title" data-i18n="toTitle"></button>
      <button id="btn-select-close" data-i18n="close"></button>
    </div>
  </div>
</div>

<div id="title" hidden>
  <div class="title-card">
    <div class="moon"></div>
    <h1 data-i18n="title"></h1>
    <p class="tagline" data-i18n="tagline"></p>
    <button id="btn-continue" class="primary"><span id="continue-label"></span><span id="continue-at" class="sub"></span></button>
    <button id="btn-title-stages" class="wide" data-i18n="stages"></button>
    <div class="settings">
      <button class="btn-lang" data-i18n="langSwitch"></button>
      <button class="btn-sfx"></button>
    </div>
    <p class="credit">© ORUVIX Studio</p>
  </div>
</div>

<div id="help" data-i18n-html="help"></div>

<script src="src/logic.js"></script>
<script src="src/levels.js"></script>
<script src="src/i18n.js"></script>
<script src="src/audio.js"></script>
<script src="src/main.js"></script>
</body>
</html>
